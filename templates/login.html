<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT&amp;D Sehat Sync Walk</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --ink: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #d1fae5 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, #a7f3d0 0%, transparent 40%),
                  linear-gradient(160deg, #ecfdf5 0%, #f0fdfa 45%, #eff6ff 100%);
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px 32px;
      box-shadow: 0 20px 50px -12px rgba(16, 185, 129, 0.25), 0 4px 12px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.08);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 20px -6px rgba(5, 150, 105, 0.5);
    }
    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      margin: 0 0 28px;
    }
    .flash {
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13.5px;
    }
    .flash.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .field { margin-bottom: 18px; }
    input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14.5px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #f8fafc;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      background: #ffffff;
    }
    button {
      width: 100%;
      padding: 12px 18px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 6px 16px -4px rgba(5, 150, 105, 0.45);
    }
    button:hover { box-shadow: 0 8px 20px -4px rgba(5, 150, 105, 0.55); }
    button:active { transform: translateY(1px); }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.5 4.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="#fff"/>
        <path d="M10.8 8.4 8 12.5l-3.2 1.6a1 1 0 0 0 .9 1.8l3.6-1.8a1 1 0 0 0 .4-.35l1.4-2 1.1 2.4-2.4 3.7a1 1 0 0 0-.16.55v4.1a1 1 0 1 0 2 0v-3.8l2.3-3.55 1.15 2.5a1 1 0 0 0 .3.37l3 2.3a1 1 0 1 0 1.22-1.58l-2.8-2.15-2.35-5.1a1.9 1.9 0 0 0-2.7-.85l-2 1.15Z" fill="#fff"/>
      </svg>
    </div>
    <h1>IT&amp;D Sehat Sync Walk</h1>
    <p class="subtitle">Masuk untuk kelola sinkronisasi langkah &amp; challenge grup</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit">Masuk</button>
    </form>

    <p class="footer-note">IT&amp;D Healthy Program &middot; Kideco</p>
  </div>
</body>
</html>
